name: geolinked
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  riverpod: ^3.2.1
  flutter_riverpod: ^3.3.1
  dio: ^5.9.0
  json_annotation: ^4.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^19.4.0
  geocoding: ^4.0.0
  latlong2: ^0.9.1
  flutter_map: ^8.3.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  geoflutterfire_plus: ^0.0.34
  change_app_package_name: ^1.5.0
  google_sign_in: ^7.2.0
  firebase_storage: ^13.3.0
  image_picker: ^1.2.2
  workmanager: ^0.9.0+3
  flutter_map_marker_cluster: ^8.2.2
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.6.1
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
